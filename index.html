<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Box</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
  :root {
    --bg: oklch(95% 0.02 300);
    --text: oklch(28% 0.03 300);
    --text-muted: oklch(50% 0.02 300);
    --card-bg: oklch(100% 0 0);
    --border-muted: oklch(80% 0.02 300);
    --accent: oklch(70% 0.17 30);
  }
  .dark {
    --bg: oklch(24% 0.03 300);
    --text: oklch(92% 0.015 300);
    --text-muted: oklch(70% 0.02 300);
    --card-bg: oklch(29% 0.03 300);
    --border-muted: oklch(40% 0.02 300);
    --accent: oklch(74% 0.17 30);
  }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .font-display { font-family: 'Baloo 2', system-ui, sans-serif; }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-5xl mx-auto px-6 md:px-10 py-10">

  <header class="sticky top-0 z-10 flex items-center justify-between py-4 mb-10" style="background:var(--bg); border-bottom: 2px solid var(--card-bg);">
    <div class="font-display text-xl font-bold flex items-center gap-2">
      <span class="inline-block w-3 h-3 rounded-full" style="background:var(--accent)"></span>
      Tool Box
    </div>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
      class="w-10 h-10 rounded-full border-2 flex items-center justify-center cursor-pointer"
      style="border-color:var(--accent); color:var(--accent); background:var(--card-bg);">
      <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></svg>
    </button>
  </header>

  <section class="max-w-xl pb-14">
    <h1 class="font-display text-3xl md:text-4xl font-bold leading-tight mb-4">
      A growing
      <span style="background: color-mix(in oklch, var(--accent) 22%, var(--card-bg)); padding: 2px 10px; border-radius: 8px;">toolbox</span>
      of web tools &amp; lessons
    </h1>
    <p class="text-base leading-relaxed" style="color:var(--text-muted)">Pick a tool below to try it out. More tools and lessons join the collection over time.</p>
  </section>

  <section id="tool-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 pb-16"></section>

  <div id="tool-sections"></div>

  <footer class="pt-10 mt-4 text-sm" style="border-top: 2px solid var(--card-bg); color:var(--text-muted)">
    Vanilla HTML, CSS &amp; JS — no frameworks, no build step.
  </footer>
</div>

<script>
  // ---- Theme toggle ----
  const SUN_PATH = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  const MOON_PATH = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
  const themeIcon = document.getElementById('theme-icon');

  function applyTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    themeIcon.innerHTML = dark ? MOON_PATH : SUN_PATH;
  }

  function initTheme() {
    const stored = localStorage.getItem('theme');
    const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(dark);
  }

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const dark = !document.documentElement.classList.contains('dark');
    applyTheme(dark);
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    if (nacaData) drawNacaSvg(nacaData);
  });

  initTheme();

  // ---- TOOLS config ----
  // Adding a future tool: add one entry here, it gets a card, a jump-openable
  // section, and a category badge automatically — nothing else to wire up.
  const TOOLS = [
    {
      id: 'unit-converter',
      title: 'Unit Converter',
      description: 'Convert length, weight, temperature, and volume between units.',
      category: 'Tool',
      icon: '<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.6 2.6-2-2z"/>'
    },
    {
      id: 'regex-tester',
      title: 'Regex Tester',
      description: 'Test regex patterns with live match highlighting and capture groups.',
      category: 'Tool',
      icon: '<path d="M8 4L4 12l4 8M16 4l4 8-4 8"/>'
    },
    {
      id: 'naca-airfoil',
      title: 'NACA Airfoil Visualizer',
      description: 'Plot a NACA 4-digit airfoil from its code, with camber line, key stats, and coordinate export.',
      category: 'Tool',
      icon: '<path d="M3 13c2.5-4.5 9-6.5 16-4.5-1.5 1-1.5 3 0 4-7 3-13.5 1.5-16 .5z"/>',
      sectionBody: nacaAirfoilBodyHTML
    }
  ];

  function cardHTML(tool) {
    return `
      <button type="button" data-open="${tool.id}"
        class="text-left rounded-2xl p-6 flex flex-col gap-3 shadow-md hover:shadow-lg transition-shadow cursor-pointer"
        style="background:var(--card-bg);">
        <div class="flex items-center justify-between">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: color-mix(in oklch, var(--accent) 18%, var(--card-bg));">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${tool.icon}</svg>
          </div>
          <span class="text-xs font-bold text-white px-2.5 py-1 rounded-full" style="background:var(--accent)">${tool.category.toUpperCase()}</span>
        </div>
        <div class="font-display text-lg font-bold">${tool.title}</div>
        <p class="text-sm leading-relaxed" style="color:var(--text-muted)">${tool.description}</p>
      </button>
    `;
  }

  function comingSoonCardHTML() {
    return `
      <button type="button" disabled aria-disabled="true"
        class="text-left rounded-2xl p-6 flex flex-col gap-3 border-2 border-dashed opacity-70 cursor-not-allowed"
        style="border-color:var(--border-muted); background:transparent;">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:var(--bg);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        </div>
        <div class="font-display text-lg font-bold">More coming soon</div>
        <p class="text-sm leading-relaxed" style="color:var(--text-muted)">New tools and lessons join the collection as it grows.</p>
      </button>
    `;
  }

  function sectionHTML(tool) {
    const body = tool.sectionBody
      ? tool.sectionBody()
      : `<p class="text-sm leading-relaxed" style="color:var(--text-muted)">This tool's logic hasn't been built yet — this section exists to prove the open/close pattern works. Real functionality lands in a later phase.</p>`;
    return `
      <section id="tool-${tool.id}" hidden class="rounded-2xl p-8 mb-6 shadow-md" style="background:var(--card-bg);">
        <div class="flex items-start justify-between gap-4 mb-4">
          <div>
            <span class="text-xs font-bold text-white px-2.5 py-1 rounded-full" style="background:var(--accent)">${tool.category.toUpperCase()}</span>
            <h2 class="font-display text-2xl font-bold mt-3">${tool.title}</h2>
          </div>
          <button type="button" data-close="${tool.id}" aria-label="Close ${tool.title}"
            class="w-9 h-9 rounded-full border-2 flex items-center justify-center shrink-0 cursor-pointer"
            style="border-color:var(--border-muted); color:var(--text-muted);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        ${body}
      </section>
    `;
  }

  // ---- NACA Airfoil Visualizer ----
  // 4-digit series only: code MPXX -> max camber M (%c), camber position P
  // (tenths of chord), max thickness XX (%c). Standard textbook formulas,
  // cosine-spaced stations, open (non-zero-gap) trailing edge.
  function nacaAirfoilBodyHTML() {
    return `
      <div class="flex flex-col gap-6">
        <div class="flex flex-wrap items-end gap-6">
          <div>
            <label for="naca-code" class="block text-xs font-bold mb-1" style="color:var(--text-muted)">NACA CODE</label>
            <input id="naca-code" type="text" inputmode="numeric" maxlength="4" value="2412"
              class="w-24 rounded-lg border-2 px-3 py-2 text-center font-display text-lg font-bold"
              style="border-color:var(--border-muted); background:var(--bg); color:var(--text);">
          </div>
          <div class="flex-1 min-w-[160px]">
            <label for="naca-camber" class="block text-xs font-bold mb-1" style="color:var(--text-muted)">MAX CAMBER — <span id="naca-camber-val">2%</span></label>
            <input id="naca-camber" type="range" min="0" max="9" value="2" class="w-full">
          </div>
          <div class="flex-1 min-w-[160px]">
            <label for="naca-pos" class="block text-xs font-bold mb-1" style="color:var(--text-muted)">CAMBER POSITION — <span id="naca-pos-val">0.4c</span></label>
            <input id="naca-pos" type="range" min="0" max="9" value="4" class="w-full">
          </div>
          <div class="flex-1 min-w-[160px]">
            <label for="naca-thickness" class="block text-xs font-bold mb-1" style="color:var(--text-muted)">MAX THICKNESS — <span id="naca-thickness-val">12%</span></label>
            <input id="naca-thickness" type="range" min="1" max="40" value="12" class="w-full">
          </div>
        </div>
        <p class="text-xs" style="color:var(--text-muted)">4-digit series only. Camber position only takes effect when max camber is above 0%.</p>

        <svg id="naca-svg" viewBox="0 0 1000 460" class="w-full rounded-xl" style="background:var(--bg);"></svg>

        <div class="flex flex-wrap gap-x-8 gap-y-2 text-sm">
          <div><span style="color:var(--text-muted)">Max thickness:</span> <span id="naca-thickness-stat" class="font-bold"></span></div>
          <div id="naca-camber-stat-row"><span style="color:var(--text-muted)">Max camber:</span> <span id="naca-camber-stat" class="font-bold"></span></div>
        </div>

        <div class="flex items-center justify-between">
          <h3 class="font-display font-bold">Coordinates</h3>
          <button id="naca-download" type="button"
            class="text-xs font-bold text-white px-3 py-1.5 rounded-full cursor-pointer"
            style="background:var(--accent)">Download CSV</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <div class="text-xs font-bold mb-1" style="color:var(--text-muted)">UPPER SURFACE</div>
            <div class="rounded-lg border-2 overflow-y-auto font-mono text-xs" style="border-color:var(--border-muted); max-height:200px;">
              <table class="w-full"><tbody id="naca-upper-table"></tbody></table>
            </div>
          </div>
          <div>
            <div class="text-xs font-bold mb-1" style="color:var(--text-muted)">LOWER SURFACE</div>
            <div class="rounded-lg border-2 overflow-y-auto font-mono text-xs" style="border-color:var(--border-muted); max-height:200px;">
              <table class="w-full"><tbody id="naca-lower-table"></tbody></table>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function computeNacaAirfoil(mPct, pTenths, tPct, n) {
    const m = mPct / 100, p = pTenths / 10, t = tPct / 100;
    const upper = [], lower = [], camber = [];
    let maxThickness = { value: 0, x: 0 };
    let maxCamberPt = { value: 0, x: 0 };

    for (let i = 0; i <= n; i++) {
      const beta = Math.PI * i / n;
      const x = (1 - Math.cos(beta)) / 2;
      const yt = 5 * t * (0.2969 * Math.sqrt(x) - 0.1260 * x - 0.3516 * x ** 2 + 0.2843 * x ** 3 - 0.1015 * x ** 4);
      if (yt > maxThickness.value) maxThickness = { value: yt, x };

      let yc = 0, dyc = 0;
      if (m > 0 && p > 0) {
        if (x < p) {
          yc = (m / (p * p)) * (2 * p * x - x * x);
          dyc = (2 * m / (p * p)) * (p - x);
        } else {
          yc = (m / ((1 - p) * (1 - p))) * ((1 - 2 * p) + 2 * p * x - x * x);
          dyc = (2 * m / ((1 - p) * (1 - p))) * (p - x);
        }
      }
      if (yc > maxCamberPt.value) maxCamberPt = { value: yc, x };

      const theta = Math.atan(dyc);
      upper.push([x - yt * Math.sin(theta), yc + yt * Math.cos(theta)]);
      lower.push([x + yt * Math.sin(theta), yc - yt * Math.cos(theta)]);
      camber.push([x, yc]);
    }

    return { upper, lower, camber, maxThickness, maxCamberPt };
  }

  let nacaData = null;

  function renderNacaAirfoil() {
    const camberSlider = document.getElementById('naca-camber');
    const posSlider = document.getElementById('naca-pos');
    const thicknessSlider = document.getElementById('naca-thickness');
    const codeInput = document.getElementById('naca-code');

    const m = Number(camberSlider.value);
    const p = Number(posSlider.value);
    const t = Number(thicknessSlider.value);

    document.getElementById('naca-camber-val').textContent = m + '%';
    document.getElementById('naca-pos-val').textContent = (p / 10).toFixed(1) + 'c';
    document.getElementById('naca-thickness-val').textContent = t + '%';
    codeInput.value = `${m}${p}${String(t).padStart(2, '0')}`;

    nacaData = computeNacaAirfoil(m, p, t, 80);

    document.getElementById('naca-thickness-stat').textContent =
      `${(nacaData.maxThickness.value * 200).toFixed(1)}% at ${(nacaData.maxThickness.x * 100).toFixed(0)}%c`;

    const camberStatRow = document.getElementById('naca-camber-stat-row');
    if (m > 0 && p > 0) {
      camberStatRow.hidden = false;
      document.getElementById('naca-camber-stat').textContent =
        `${(nacaData.maxCamberPt.value * 100).toFixed(1)}% at ${(nacaData.maxCamberPt.x * 100).toFixed(0)}%c`;
    } else {
      camberStatRow.hidden = true;
    }

    drawNacaSvg(nacaData);
    fillNacaTables(nacaData);
  }

  function drawNacaSvg(data) {
    const svg = document.getElementById('naca-svg');
    const W = 1000, H = 460, marginX = 40, marginY = 40;

    let yMax = 0.001;
    [...data.upper, ...data.lower, ...data.camber].forEach(([, y]) => {
      yMax = Math.max(yMax, Math.abs(y));
    });
    yMax *= 1.15;

    const scale = Math.min((W - 2 * marginX) / 1, (H - 2 * marginY) / (2 * yMax));
    const xOffset = (W - scale) / 2;
    const yCenter = H / 2;
    const toX = x => xOffset + x * scale;
    const toY = y => yCenter - y * scale;

    const outline = [...data.upper, ...[...data.lower].reverse()];
    const outlinePath = 'M ' + outline.map(([x, y]) => `${toX(x).toFixed(1)},${toY(y).toFixed(1)}`).join(' L ') + ' Z';
    const camberPath = 'M ' + data.camber.map(([x, y]) => `${toX(x).toFixed(1)},${toY(y).toFixed(1)}`).join(' L ');
    const hasCamber = data.camber.some(([, y]) => y !== 0);

    const style = getComputedStyle(document.documentElement);
    const accent = style.getPropertyValue('--accent').trim();
    const textMuted = style.getPropertyValue('--text-muted').trim();

    svg.innerHTML = `
      <line x1="${toX(0)}" y1="${toY(0)}" x2="${toX(1)}" y2="${toY(0)}" stroke="${textMuted}" stroke-width="1" stroke-dasharray="4 4" />
      <path d="${outlinePath}" fill="${accent}" fill-opacity="0.18" stroke="${accent}" stroke-width="2.5" />
      ${hasCamber ? `<path d="${camberPath}" fill="none" stroke="${accent}" stroke-width="1.5" stroke-dasharray="6 4" />` : ''}
    `;
  }

  function fillNacaTables(data) {
    const rowHTML = ([x, y]) => `<tr><td class="px-2 py-0.5">${x.toFixed(4)}</td><td class="px-2 py-0.5">${y.toFixed(4)}</td></tr>`;
    document.getElementById('naca-upper-table').innerHTML = data.upper.map(rowHTML).join('');
    document.getElementById('naca-lower-table').innerHTML = data.lower.map(rowHTML).join('');
  }

  function downloadNacaCsv() {
    if (!nacaData) return;
    const lines = ['surface,x,y'];
    nacaData.upper.forEach(([x, y]) => lines.push(`upper,${x.toFixed(6)},${y.toFixed(6)}`));
    nacaData.lower.forEach(([x, y]) => lines.push(`lower,${x.toFixed(6)},${y.toFixed(6)}`));
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `naca-${document.getElementById('naca-code').value}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function initNacaAirfoil() {
    const codeInput = document.getElementById('naca-code');
    const camberSlider = document.getElementById('naca-camber');
    const posSlider = document.getElementById('naca-pos');
    const thicknessSlider = document.getElementById('naca-thickness');

    [camberSlider, posSlider, thicknessSlider].forEach(el => el.addEventListener('input', renderNacaAirfoil));

    codeInput.addEventListener('input', () => {
      const digits = codeInput.value.replace(/\D/g, '').slice(0, 4);
      codeInput.value = digits;
      if (digits.length !== 4) return;
      camberSlider.value = digits[0];
      posSlider.value = digits[1];
      thicknessSlider.value = Math.min(40, Math.max(1, Number(digits.slice(2))));
      renderNacaAirfoil();
    });

    document.getElementById('naca-download').addEventListener('click', downloadNacaCsv);

    renderNacaAirfoil();
  }

  document.getElementById('tool-grid').innerHTML = TOOLS.map(cardHTML).join('') + comingSoonCardHTML();
  document.getElementById('tool-sections').innerHTML = TOOLS.map(sectionHTML).join('');
  initNacaAirfoil();

  // ---- Open/close ----
  function openTool(id) {
    TOOLS.forEach(t => {
      const section = document.getElementById('tool-' + t.id);
      if (section) section.hidden = t.id !== id;
    });
    document.getElementById('tool-' + id).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeTool(id) {
    document.getElementById('tool-' + id).hidden = true;
  }

  document.addEventListener('click', (event) => {
    const openBtn = event.target.closest('[data-open]');
    if (openBtn) { openTool(openBtn.dataset.open); return; }

    const closeBtn = event.target.closest('[data-close]');
    if (closeBtn) { closeTool(closeBtn.dataset.close); return; }
  });
</script>
</body>
</html>
