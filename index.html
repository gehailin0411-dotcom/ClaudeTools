<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Box</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
  :root {
    --bg: oklch(95% 0.02 300);
    --text: oklch(28% 0.03 300);
    --text-muted: oklch(50% 0.02 300);
    --card-bg: oklch(100% 0 0);
    --border-muted: oklch(80% 0.02 300);
    --accent: oklch(70% 0.17 30);
  }
  .dark {
    --bg: oklch(24% 0.03 300);
    --text: oklch(92% 0.015 300);
    --text-muted: oklch(70% 0.02 300);
    --card-bg: oklch(29% 0.03 300);
    --border-muted: oklch(40% 0.02 300);
    --accent: oklch(74% 0.17 30);
  }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .font-display { font-family: 'Baloo 2', system-ui, sans-serif; }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-5xl mx-auto px-6 md:px-10 py-10">

  <header class="sticky top-0 z-10 flex items-center justify-between py-4 mb-10" style="background:var(--bg); border-bottom: 2px solid var(--card-bg);">
    <div class="font-display text-xl font-bold flex items-center gap-2">
      <span class="inline-block w-3 h-3 rounded-full" style="background:var(--accent)"></span>
      Tool Box
    </div>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
      class="w-10 h-10 rounded-full border-2 flex items-center justify-center cursor-pointer"
      style="border-color:var(--accent); color:var(--accent); background:var(--card-bg);">
      <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></svg>
    </button>
  </header>

  <section class="max-w-xl pb-14">
    <h1 class="font-display text-3xl md:text-4xl font-bold leading-tight mb-4">
      A growing
      <span style="background: color-mix(in oklch, var(--accent) 22%, var(--card-bg)); padding: 2px 10px; border-radius: 8px;">toolbox</span>
      of web tools &amp; lessons
    </h1>
    <p class="text-base leading-relaxed" style="color:var(--text-muted)">Pick a tool below to try it out. More tools and lessons join the collection over time.</p>
  </section>

  <section id="tool-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 pb-16"></section>

  <div id="tool-sections"></div>

  <footer class="pt-10 mt-4 text-sm" style="border-top: 2px solid var(--card-bg); color:var(--text-muted)">
    Vanilla HTML, CSS &amp; JS — no frameworks, no build step.
  </footer>
</div>

<script>
  // ---- Theme toggle ----
  const SUN_PATH = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  const MOON_PATH = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
  const themeIcon = document.getElementById('theme-icon');

  function applyTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    themeIcon.innerHTML = dark ? MOON_PATH : SUN_PATH;
  }

  function initTheme() {
    const stored = localStorage.getItem('theme');
    const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(dark);
  }

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const dark = !document.documentElement.classList.contains('dark');
    applyTheme(dark);
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  });

  initTheme();

  // ---- TOOLS config ----
  // Adding a future tool: add one entry here, it gets a card, a jump-openable
  // section, and a category badge automatically — nothing else to wire up.
  const TOOLS = [
    {
      id: 'unit-converter',
      title: 'Unit Converter',
      description: 'Convert length, weight, temperature, and volume between units.',
      category: 'Tool',
      icon: '<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.6 2.6-2-2z"/>'
    },
    {
      id: 'regex-tester',
      title: 'Regex Tester',
      description: 'Test regex patterns with live match highlighting and capture groups.',
      category: 'Tool',
      icon: '<path d="M8 4L4 12l4 8M16 4l4 8-4 8"/>'
    }
  ];

  function cardHTML(tool) {
    return `
      <button type="button" data-open="${tool.id}"
        class="text-left rounded-2xl p-6 flex flex-col gap-3 shadow-md hover:shadow-lg transition-shadow cursor-pointer"
        style="background:var(--card-bg);">
        <div class="flex items-center justify-between">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: color-mix(in oklch, var(--accent) 18%, var(--card-bg));">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${tool.icon}</svg>
          </div>
          <span class="text-xs font-bold text-white px-2.5 py-1 rounded-full" style="background:var(--accent)">${tool.category.toUpperCase()}</span>
        </div>
        <div class="font-display text-lg font-bold">${tool.title}</div>
        <p class="text-sm leading-relaxed" style="color:var(--text-muted)">${tool.description}</p>
      </button>
    `;
  }

  function comingSoonCardHTML() {
    return `
      <button type="button" disabled aria-disabled="true"
        class="text-left rounded-2xl p-6 flex flex-col gap-3 border-2 border-dashed opacity-70 cursor-not-allowed"
        style="border-color:var(--border-muted); background:transparent;">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:var(--bg);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        </div>
        <div class="font-display text-lg font-bold">More coming soon</div>
        <p class="text-sm leading-relaxed" style="color:var(--text-muted)">New tools and lessons join the collection as it grows.</p>
      </button>
    `;
  }

  function sectionHTML(tool) {
    return `
      <section id="tool-${tool.id}" hidden class="rounded-2xl p-8 mb-6 shadow-md" style="background:var(--card-bg);">
        <div class="flex items-start justify-between gap-4 mb-4">
          <div>
            <span class="text-xs font-bold text-white px-2.5 py-1 rounded-full" style="background:var(--accent)">${tool.category.toUpperCase()}</span>
            <h2 class="font-display text-2xl font-bold mt-3">${tool.title}</h2>
          </div>
          <button type="button" data-close="${tool.id}" aria-label="Close ${tool.title}"
            class="w-9 h-9 rounded-full border-2 flex items-center justify-center shrink-0 cursor-pointer"
            style="border-color:var(--border-muted); color:var(--text-muted);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <p class="text-sm leading-relaxed" style="color:var(--text-muted)">This tool's logic hasn't been built yet — this section exists to prove the open/close pattern works. Real functionality lands in a later phase.</p>
      </section>
    `;
  }

  document.getElementById('tool-grid').innerHTML = TOOLS.map(cardHTML).join('') + comingSoonCardHTML();
  document.getElementById('tool-sections').innerHTML = TOOLS.map(sectionHTML).join('');

  // ---- Open/close ----
  function openTool(id) {
    TOOLS.forEach(t => {
      const section = document.getElementById('tool-' + t.id);
      if (section) section.hidden = t.id !== id;
    });
    document.getElementById('tool-' + id).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeTool(id) {
    document.getElementById('tool-' + id).hidden = true;
  }

  document.addEventListener('click', (event) => {
    const openBtn = event.target.closest('[data-open]');
    if (openBtn) { openTool(openBtn.dataset.open); return; }

    const closeBtn = event.target.closest('[data-close]');
    if (closeBtn) { closeTool(closeBtn.dataset.close); return; }
  });
</script>
</body>
</html>
